version: "3"

services:
  monitor:
    build: .
    container_name: system-health-monitor
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: system-health-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      - monitor