name: pulse

services:
  monitor:
    build: .
    container_name: pulse_api
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8000:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://127.0.0.1:8000/health', timeout=3).raise_for_status()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    container_name: pulse_prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    depends_on:
      monitor:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: pulse_grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

volumes:
  grafana_data: